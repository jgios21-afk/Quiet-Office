[project]
name = "quiet-office"
version = "0.1.0"
description = "An autonomous back office built on Strands Agents: scheduling, receivables, bookkeeping, payables, reception and compliance that only surface real decisions."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["strands-agents>=1.0", "boto3>=1.34"]

[project.optional-dependencies]
anthropic = ["strands-agents[anthropic]"]
ollama = ["strands-agents[ollama]"]
agentcore = ["bedrock-agentcore"]
dev = ["pytest"]

[project.scripts]
quiet-office = "quiet_office.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quiet_office*"]
